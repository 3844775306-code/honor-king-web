#:schema ./schema.sql
name = "honorking-saves"
main = "src/index.js"
compatibility_date = "2026-11-01"

# 部署前：
# 1) npx wrangler d1 create honorking-saves
# 2) 把上面的 database_id 换成命令输出里的 uuid
# 3) npx wrangler secret put CLOUD_TOKEN   （朋友共用的口令）
[[d1_databases]]
binding = "DB"
database_name = "honorking-saves"
database_id = "REPLACE_WITH_YOUR_D1_ID"

[vars]
# 网页版客户端需要跨域；原生端用不到。可改成 "https://你的站点"
ALLOWED_ORIGIN = "*"
